
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kampüs Etkinlik Panosu</title>
  <link rel="stylesheet" href="stil.css">
<body>

  <header>
    <div class="logo">Bozok Etkinlik</div>
    <nav aria-label="Ana menü">
      <a href="#etkinlikler">Etkinlikler</a>
      <a href="#oner">Etkinlik Öner</a>
    </nav>
  </header>

  <main>
    <section id="etkinlikler">
      <h1>Yaklaşan Kampüs Etkinlikleri</h1>

      <div class="filtreler">
        <button type="button">Tümü</button>
        <button type="button">Atölye</button>
        <button type="button">Söyleşi</button>
        <button type="button">Topluluk</button>
      </div>

      <label for="arama">Etkinlik Ara</label>
      <input type="search" id="arama"
             placeholder="Etkinlik adı yazın">

      <div id="etkinlik-listesi">
        <p>Etkinlikler burada listelenecek.</p>
      </div>
    </section>

    <section id="oner">
      <h2>Etkinlik Öner</h2>

      <form id="oneri-formu">
       <label for="baslik">Etkinlik Adı</label>
       <input type="text" id="baslik" name="baslik">

       <label for="tarih">Etkinlik Tarihi</label>
       <input type="date" id="tarih" name="tarih">

      <label for="eposta">E-posta</label>
      <input type="email" id="eposta" name="eposta">
        <button type="submit">Öneriyi Gönder</button>
        <p id="form-mesaji" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Bozok Etkinlik</p>
  </footer>
<script src="betik.js"></script>
</body>
</html>
